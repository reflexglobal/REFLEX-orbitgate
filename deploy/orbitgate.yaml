# Edit: image (your airgapped registry), -issuer, -client-id. Create the TLS secret first:
#   kubectl -n orbitgate create secret tls orbitgate-tls --cert=tls.crt --key=tls.key
apiVersion: v1
kind: Namespace
metadata:
  name: orbitgate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbitgate
  namespace: orbitgate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbitgate
rules:
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbitgate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orbitgate
subjects:
  - kind: ServiceAccount
    name: orbitgate
    namespace: orbitgate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitgate
  namespace: orbitgate
spec:
  replicas: 2
  selector:
    matchLabels: {app: orbitgate}
  template:
    metadata:
      labels: {app: orbitgate}
    spec:
      serviceAccountName: orbitgate
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: orbitgate
          image: registry.airlock.local/reflex/orbitgate:dev
          args:
            - -issuer=https://keycloak.airlock.local/realms/airlock
            - -client-id=orbitgate
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
          ports:
            - containerPort: 8443
          readinessProbe:
            tcpSocket: {port: 8443}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: orbitgate-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: orbitgate
  namespace: orbitgate
spec:
  type: NodePort # or LoadBalancer
  selector: {app: orbitgate}
  ports:
    - port: 443
      targetPort: 8443
      nodePort: 30443
