<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Orbitgate</title>
  <rect width="128" height="128" rx="28" fill="#0b1f33"/>
  <!-- orbit, back half -->
  <ellipse cx="64" cy="68" rx="50" ry="17" fill="none" stroke="#2bd4c4" stroke-width="5" stroke-opacity="0.45" transform="rotate(-18 64 68)"/>
  <!-- gate: two pillars and a lintel -->
  <rect x="40" y="38" width="12" height="54" rx="2" fill="#e8eef5"/>
  <rect x="76" y="38" width="12" height="54" rx="2" fill="#e8eef5"/>
  <rect x="32" y="28" width="64" height="12" rx="3" fill="#e8eef5"/>
  <!-- orbit, front half drawn over the gate -->
  <path d="M 15.9 83.3 A 50 17 -18 0 0 112.1 52.7" fill="none" stroke="#2bd4c4" stroke-width="5" stroke-linecap="round"/>
  <circle cx="108" cy="54" r="6" fill="#ffb547"/>
</svg>
