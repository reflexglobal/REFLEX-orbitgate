{{- $ds := eq .Values.kind "DaemonSet" }}
{{- if and .Values.hostNetwork (not $ds) }}{{ fail "hostNetwork is only supported with kind: DaemonSet" }}{{ end }}
apiVersion: apps/v1
kind: {{ .Values.kind }}
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not $ds }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: orbitgate, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbitgate
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet  # still resolve kubernetes.default.svc
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # same as the image's USER; explicit so manifest scanners see it
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: orbitgate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -listen=:{{ .Values.listenPort }}
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -metrics-listen=:{{ .Values.metricsPort }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - {name: https, containerPort: {{ .Values.listenPort }}}
            - {name: metrics, containerPort: {{ .Values.metricsPort }}}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}  # ready when the apiserver answers
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}  # directory mount (not subPath) so rotation propagates
      volumes:
        - name: tls
          secret: {secretName: {{ .Values.tls.secretName }}}
      {{- with ($ds | ternary .Values.daemonSet.affinity .Values.affinity) }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($ds | ternary .Values.daemonSet.tolerations .Values.tolerations) }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if not $ds }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
