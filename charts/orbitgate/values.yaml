image:
  repository: ghcr.io/reflexglobal/orbitgate  # point at your airgapped registry mirror
  tag: ""                                     # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Deployment: normal pods behind the Service.
# DaemonSet: one pod on every control-plane node (scheduling from daemonSet.* below).
kind: Deployment
replicas: 2  # Deployment only

# DaemonSet only: listen directly on each control-plane node's IP at listenPort,
# next to the apiserver. Users then use the control-plane IPs; no NodePort needed.
hostNetwork: false
listenPort: 8443  # pick a free port on the nodes when hostNetwork is on
# Plain-HTTP /metrics (Prometheus), /healthz, /readyz; used by the probes. Also a node port with hostNetwork.
metricsPort: 9090

daemonSet:
  # Matches kubeadm (control-plane: "") and RKE2/k3s (control-plane: "true").
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: node-role.kubernetes.io/control-plane, operator: Exists}
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    - {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}
    - {key: node-role.kubernetes.io/etcd, operator: Exists, effect: NoExecute}
    - {key: CriticalAddonsOnly, operator: Exists}

service:
  type: NodePort  # or LoadBalancer / ClusterIP
  port: 443
  nodePort: 30443 # NodePort only; empty = random
  annotations: {}

tls:
  # Secret with tls.crt/tls.key. Orbitgate reloads it on change, no restart needed.
  # Bring your own (kubectl create secret tls ...) or let cert-manager create it below.
  secretName: orbitgate-tls
  certManager:
    enabled: false
    # Use a CA that already exists in the cluster, either:
    # a) an existing CA secret (tls.crt + tls.key of a CA) in the release namespace; the chart creates an Issuer for it
    caSecretName: ""
    # b) an existing Issuer/ClusterIssuer (CA, Vault, step-ca, ...); used when caSecretName is empty
    issuerRef:
      kind: ClusterIssuer
      name: airlock-ca
    duration: 2160h    # 90 days
    renewBefore: 720h  # renew 30 days before expiry
    # Every name/IP users put in their kubeconfig "server:" must be listed.
    dnsNames: []
    ipAddresses: []

extraArgs: []

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}
# Deployment scheduling (DaemonSet uses daemonSet.* above). nodeSelector applies to both.
nodeSelector: {}
affinity: {}
tolerations: []
