{{- with .Values.tls.certManager }}
{{- if .enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Release.Name }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $.Values.tls.secretName }}
  duration: {{ .duration }}
  renewBefore: {{ .renewBefore }}
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  usages: [server auth, digital signature]
  {{- if not (or .dnsNames .ipAddresses) }}{{ fail "tls.certManager needs dnsNames and/or ipAddresses" }}{{ end }}
  {{- with .dnsNames }}
  dnsNames: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with .ipAddresses }}
  ipAddresses: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- if .caSecretName }}
  issuerRef: {kind: Issuer, name: {{ $.Release.Name }}-ca}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $.Release.Name }}-ca
  namespace: {{ $.Release.Namespace }}
spec:
  ca:
    secretName: {{ .caSecretName }}
  {{- else }}
  issuerRef: {{ toYaml .issuerRef | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
