name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issues: don't file them here**, see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: kubectl commands, relevant RBAC, chart values (redact secrets/tokens).
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Orbitgate version
      placeholder: 0.0.1-alpha
    validations: {required: true}
  - type: input
    id: k8s
    attributes:
      label: Kubernetes version and distribution
      placeholder: v1.34, RKE2
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options: [Deployment, DaemonSet, DaemonSet + hostNetwork]
  - type: textarea
    id: logs
    attributes:
      label: Orbitgate logs
      render: text
